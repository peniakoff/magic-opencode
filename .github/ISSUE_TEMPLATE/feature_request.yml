name: Feature request
description: Propose an improvement to agents, commands, skills, or wrappers
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the outcome you want. Behavior changes should stay dual-pack compatible when practical — see CONTRIBUTING.md.
  - type: dropdown
    id: pack
    attributes:
      label: Primary pack
      options:
        - OpenCode
        - Cursor
        - Both
        - Docs / meta
      default: 2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction or gap exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the packs behave instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
